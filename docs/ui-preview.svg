    <text x="145" y="485" font-size="18" font-weight="700">双因素验证码（TOTP）</text>
    <text x="820" y="485" font-size="18" font-weight="700">登录后执行命令</text>
  </g>

  <g fill="#fff" stroke="#cbd9e8" stroke-width="1.5">
