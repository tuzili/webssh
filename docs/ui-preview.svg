  <text x="462" y="606" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#fff">🔗 SSH 连接链接</text>

  <rect x="145" y="644" width="1240" height="52" rx="6" fill="#f5f9fd" stroke="#c9dbea"/>
