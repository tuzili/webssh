  <circle cx="165" cy="99" r="27" fill="#fff"/>
  <text x="155" y="110" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#087ff5">⌂</text>
  <text x="215" y="92" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#fff">WebSSH 远程终端</text>
  <text x="215" y="123" font-family="Arial, sans-serif" font-size="17" fill="#dceeff">通过浏览器轻松连接 SSH 服务器</text>

