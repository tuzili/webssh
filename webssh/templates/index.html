<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <title>WebSSH 远程终端</title>
    <link href="static/img/favicon.png" rel="icon" type="image/png">
    <link href="static/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <link href="static/css/xterm.min.css" rel="stylesheet" type="text/css"/>
    <link href="static/css/fullscreen.min.css" rel="stylesheet" type="text/css"/>
    <style>
      .row {
        margin-top: 15px;
        margin-bottom: 10px;
      }

      .container {
        margin-top: 20px;
      }

      .btn {
        margin-top: 15px;
      }

      .btn-danger {
        margin-left: 5px;
      }

      .page-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 25px;
        padding: 14px 0 18px;
        border-bottom: 1px solid #e9ecef;
      }

      .github-header-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #1989fa;
        text-decoration: none;
        flex-shrink: 0;
      }

      .github-header-link:hover {
        color: #0d6efd;
      }

      .page-title {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
      }

      .sshlink-row {
        display: flex;
        align-items: stretch;
        gap: 8px;
        margin-top: 15px;
      }

      #sshlink {
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        background: #f8f9fa;
        word-break: break-all;
        font-size: 14px;
      }

      #copySSHlinkBtn {
        margin-top: 0;
        white-space: nowrap;
      }
      {% if font.family %}
      @font-face {
        font-family: '{{ font.family }}';
        src: url('{{ font.url }}');
      }

      body {
        font-family: '{{ font.family }}';
      }
      {% end %}
    </style>
  </head>
  <body>
    <div id="waiter" style="display: none"> 正在连接服务器…… </div>

    <div class="container form-container" style="display: none">
      <div class="page-header">
        <a class="github-header-link" href="https://github.com/tuzili/webssh" target="_blank"
           rel="noopener noreferrer" aria-label="GitHub 项目" title="GitHub 项目">
          <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.77.11 3.06.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.27 5.69.41.35.77 1.04.77 2.1 0 1.52-.01 2.74-.01 3.11 0 .31.21.68.8.56A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
          </svg>
        </a>
        <h1 class="page-title">WebSSH 远程终端</h1>
      </div>

      <form id="connect" action="" method="post" enctype="multipart/form-data"{% if debug %} novalidate{% end %}>
        <div class="row">
          <div class="col">
            <label for="hostname">服务器地址</label>
            <input class="form-control" type="text" id="hostname" name="hostname" value="" required>
          </div>
          <div class="col">
            <label for="port">端口</label>
            <input class="form-control" type="number" id="port" name="port" placeholder="22" value="" min=1 max=65535>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="username">用户名</label>
            <input class="form-control" type="text" id="username" name="username" placeholder="root" value="" required>
          </div>
          <div class="col">
            <label for="password">密码</label>
            <input class="form-control" type="password" id="password" name="password" value="">
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="privatekey">私钥</label>
            <input class="form-control" type="file" id="privatekey" name="privatekey" value="">
          </div>
          <div class="col">
            <label for="passphrase">私钥口令</label>
            <input class="form-control" type="password" id="passphrase" name="passphrase" value="">
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="totp">双因素验证码（TOTP）</label>
            <input class="form-control" type="password" id="totp" name="totp" value="">
          </div>
          <div class="col">
            <label for="InitCmd">登录后执行命令</label>
            <input class="form-control" type="text" id="initcmd" name="initcmd" value="">
          </div>
        </div>
        <input type="hidden" id="term" name="term" value="xterm-256color">
        {% module xsrf_form_html() %}
        <button type="submit" class="btn btn-primary">连接服务器</button>
        <button type="reset" class="btn btn-danger">重置</button>
        <button type="button" class="btn btn-info" id="sshlinkBtn">SSH 连接链接</button>
        <div class="sshlink-row">
          <div id="sshlink"></div>
          <button type="button" class="btn btn-primary" id="copySSHlinkBtn">复制</button>
        </div>
      </form>
    </div>

    <div class="container">
      <div id="status" style="color: red;" aria-live="polite"></div>
      <div id="terminal"></div>
    </div>

    <script src="static/js/jquery.min.js"></script>
    <script src="static/js/popper.min.js"></script>
    <script src="static/js/bootstrap.min.js"></script>
    <script src="static/js/xterm.min.js"></script>
    <script src="static/js/xterm-addon-fit.min.js"></script>
    <script src="static/js/main.js"></script>
  </body>
</html>
